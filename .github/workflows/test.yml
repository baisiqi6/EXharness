name: test

on:
  push:
  pull_request:

jobs:
  harness-runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run harness runtime tests
        run: python -m unittest discover -s skills/long-running-project-harness/references/tests -p 'test_*.py'
      - name: Check shell entrypoint
        run: bash -n skills/long-running-project-harness/references/scripts/harnessctl
